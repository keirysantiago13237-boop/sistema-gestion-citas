<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">📅 Sistema de Gestión de Citas</span>
            <a href="{% url 'lista_citas' %}" class="btn btn-outline-light btn-sm">← Volver</a>
        </div>
    </nav>
    <div class="container mt-4" style="max-width:500px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">{% if form.instance.pk %}Editar Cita{% else %}Nueva Cita{% endif %}</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Guardar</button>
            </form>
        </div>
    </div>
</body>
</html>
